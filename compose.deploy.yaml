name: ${ASCNUCC_COMPOSE_PROJECT:-ascnucc}

x-ascnucc-labels: &ascnucc-labels
  io.ascnucc.managed: 'true'
  io.ascnucc.deployment-id: ${ASCNUCC_DEPLOYMENT_ID:-unconfigured}

x-cms-environment: &cms-environment
  DATABASE_URL: ${DATABASE_URL:-}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:-}
  MEDIA_STORAGE_MODE: s3
  MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
  MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
  MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
  MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
  MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-false}

services:
  web:
    profiles: [web]
    image: ${ASCNUCC_WEB_IMAGE:-association-portal-web-unconfigured}
    environment:
      CMS_API_URL: ${CMS_API_URL:-}
    ports:
      - '${ASCNUCC_APP_BIND_IP:-127.0.0.1}:${ASCNUCC_WEB_PORT:-3000}:3000'
    networks: [app]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels: *ascnucc-labels

  cms:
    profiles: [cms]
    image: ${ASCNUCC_CMS_IMAGE:-association-portal-cms-unconfigured}
    environment: *cms-environment
    ports:
      - '${ASCNUCC_APP_BIND_IP:-127.0.0.1}:${ASCNUCC_CMS_PORT:-3001}:3001'
    networks: [app, data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels: *ascnucc-labels

  migrate:
    profiles: [cms]
    image: ${ASCNUCC_CMS_IMAGE:-association-portal-cms-unconfigured}
    environment: *cms-environment
    command: [pnpm, --dir, apps/cms, migrate]
    networks: [data]
    restart: 'no'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels: *ascnucc-labels

  postgres:
    profiles: [data]
    image: ${ASCNUCC_POSTGRES_IMAGE:-postgres:17.11-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ascnucc}
      POSTGRES_USER: ${POSTGRES_USER:-ascnucc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - '${ASCNUCC_DATA_BIND_IP:-127.0.0.1}:${ASCNUCC_POSTGRES_PORT:-5432}:5432'
    volumes:
      - '${ASCNUCC_POSTGRES_DATA_SOURCE:-postgres_data}:/var/lib/postgresql/data'
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    labels: *ascnucc-labels

  minio:
    profiles: [data]
    image: ${ASCNUCC_MINIO_IMAGE:-minio/minio:RELEASE.2025-06-13T11-33-47Z}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - '${ASCNUCC_DATA_BIND_IP:-127.0.0.1}:${ASCNUCC_MINIO_PORT:-9000}:9000'
      - '${ASCNUCC_DATA_BIND_IP:-127.0.0.1}:${ASCNUCC_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - '${ASCNUCC_MINIO_DATA_SOURCE:-minio_data}:/data'
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    labels: *ascnucc-labels

  minio-init:
    profiles: [data]
    image: ${ASCNUCC_MC_IMAGE:-minio/mc:RELEASE.2025-05-21T01-59-54Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-ascnucc-media}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set ascnucc http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing "ascnucc/$${MEDIA_S3_BUCKET}" >/dev/null
        mc anonymous set none "ascnucc/$${MEDIA_S3_BUCKET}" >/dev/null
        cat > /tmp/ascnucc-media-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$${MEDIA_S3_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$${MEDIA_S3_BUCKET}/*"]
            }
          ]
        }
        EOF
        mc admin policy create ascnucc ascnucc-media /tmp/ascnucc-media-policy.json >/dev/null 2>&1 || true
        mc admin user add ascnucc "$${MEDIA_S3_ACCESS_KEY_ID}" "$${MEDIA_S3_SECRET_ACCESS_KEY}" >/dev/null 2>&1 || true
        mc admin policy attach ascnucc ascnucc-media --user "$${MEDIA_S3_ACCESS_KEY_ID}" >/dev/null
    networks: [data]
    restart: 'no'
    security_opt: [no-new-privileges:true]
    labels: *ascnucc-labels

volumes:
  postgres_data:
    labels: *ascnucc-labels
  minio_data:
    labels: *ascnucc-labels

networks:
  app:
    labels: *ascnucc-labels
  data:
    labels: *ascnucc-labels

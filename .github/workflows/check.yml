name: Source and workflow checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
        env:
          POSTGRES_USER: ascnucc_demo
          POSTGRES_PASSWORD: ascnucc_demo
          POSTGRES_DB: ascnucc_demo_test
        ports: [15432:5432]
        options: >-
          --health-cmd "pg_isready -U ascnucc_demo -d ascnucc_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://ascnucc_demo:ascnucc_demo@127.0.0.1:15432/ascnucc_demo_test
      PAYLOAD_SECRET: fictional-ci-secret-not-for-deployment-32-characters
      MEDIA_STORAGE_MODE: local
      MEDIA_LOCAL_ROOT: /tmp/ascnucc-media-e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p "$MEDIA_LOCAL_ROOT"
      - run: pnpm check
      - run: sh scripts/verify-deploy-tool.sh
      - run: pnpm --dir apps/cms migrate
      - run: pnpm --dir apps/cms seed:e2e
      - run: pnpm build
      - run: pnpm --dir apps/cms exec playwright install --with-deps chromium
      - run: pnpm --dir apps/cms test:e2e

  first-test-release:
    name: Publish the first test release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'glgust/association-portal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    concurrency:
      group: first-test-release-v1.0.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create the prerelease and start its image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-first-test-release.sh
